services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./logs:/app/logs
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "127.0.0.1:4319:4317" # OTLP gRPC
      - "127.0.0.1:4315:4318" # OTLP HTTP
      - "127.0.0.1:8888:8888" # Collector metrics
      - "127.0.0.1:8889:8889" # Prometheus metrics
      - "127.0.0.1:1313:1313" # Health check
    networks:
      - monitoring
    restart: unless-stopped

  # Loki for log aggregation
  loki:
    image: grafana/loki:3.5.1
    ports:
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:9096:9096"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring
    restart: unless-stopped
    # user: "1000:1000" # Run as non-root user

  # Tempo for distributed tracing
  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo/blocks
    ports:
      - "127.0.0.1:3200:3200" # tempo
      - "127.0.0.1:9095:9095" # tempo gRPC (for frontend communication)
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prometheus for metrics storage
  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "127.0.0.1:3101:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    # user: "1000:1000" # Run as non-root user
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  # PostgreSQL database
  postgres:
    image: postgres:15.13-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: pulseguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go backend service
  go-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/pulseguard?sslmode=disable
      PORT: "8081"
      METRICS_ADDR: "0.0.0.0:9091"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_HASH_KEY: ${SESSION_HASH_KEY:?SESSION_HASH_KEY is required}
      SESSION_BLOCK_KEY: ${SESSION_BLOCK_KEY:?SESSION_BLOCK_KEY is required}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INGEST_PUBLIC_URL: ${INGEST_PUBLIC_URL:-http://localhost:8081}
      TEMPO_URL: http://tempo:3200
      OTLP_ENDPOINT: otel-collector:4318
      LOKI_URL: http://loki:3100
      PROMETHEUS_URL: http://prometheus:9090
      CLICKHOUSE_ADDR: clickhouse:9000
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: pulseguard
      MINIO_SECRET_KEY: pulseguard-secret
      MINIO_BUCKET: payloads
      AI_UPSTREAM: http://pg-mock:8090
      AI_PROVIDER_KEY: mock
      INGEST_OTLP_URL: http://localhost:8083/v1/traces
      GATEWAY_PUBLIC_URL: http://localhost:8082/v1/chat/completions
    command: ["./pg-api"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pg-seed:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - monitoring
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: pulseguard
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - monitoring
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: pulseguard
      MINIO_ROOT_PASSWORD: pulseguard-secret
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    networks:
      - monitoring
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg-mock:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./pg-mock"]
    environment:
      PORT: "8090"
    networks:
      - monitoring

  pg-ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./pg-ingest"]
    environment:
      PORT: "8083"
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/pulseguard?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: pulseguard
      MINIO_SECRET_KEY: pulseguard-secret
      MINIO_BUCKET: payloads
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pg-seed:
        condition: service_completed_successfully
    networks:
      - monitoring

  pg-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./pg-worker"]
    environment:
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/pulseguard?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: pulseguard
      MINIO_SECRET_KEY: pulseguard-secret
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pg-seed:
        condition: service_completed_successfully
    networks:
      - monitoring

  pg-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./pg-gateway"]
    environment:
      PORT: "8082"
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/pulseguard?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      REDIS_ADDR: redis:6379
      AI_UPSTREAM: http://pg-mock:8090
      AI_PROVIDER_KEY: mock
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      pg-mock:
        condition: service_started
      pg-seed:
        condition: service_completed_successfully
    networks:
      - monitoring

  pg-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./pg-seed"]
    environment:
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/pulseguard?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - monitoring

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
        NEXT_PUBLIC_PROJECT_ID: 33333333-3333-4333-8333-333333333333
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - go-backend
    networks:
      - monitoring

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   networks:
  #     - monitoring
  #   depends_on:
  #     - postgres

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  postgres_data:
  clickhouse_data:
  minio_data:
